name: armor-preflight release

# Pushing a tag vX.Y.Z builds, signs and verifies a release
# and creates a draft GitHub release for a person to review and publish.
#
# The probe image is pushed to PROBE_REPOSITORY (repository variable; default
# ghcr.io/<owner>/armor-preflight-probe). For another registry, set the
# variables PROBE_REGISTRY and PROBE_REGISTRY_USERNAME and the secret
# PROBE_REGISTRY_PASSWORD. A new GitHub package is private: make it public
# once, so customers can pull the image without credentials (R1.5).
#
# Signing: with the secrets COSIGN_KEY (a key, or a KMS URI) and
# COSIGN_PASSWORD, and the variable COSIGN_PUBLIC_KEY (the public key, to
# verify with), releases are signed with that key. Without them, releases are
# signed keyless with this workflow's identity.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: armor-preflight-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft release
      packages: write # the probe image, when it goes to ghcr.io
      id-token: write # keyless signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version and probe repository
        env:
          PROBE_REPOSITORY: ${{ vars.PROBE_REPOSITORY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version=${GITHUB_REF_NAME#v}
          repo=${PROBE_REPOSITORY:-ghcr.io/${OWNER,,}/armor-preflight-probe}
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "PROBE_REPOSITORY=$repo" >>"$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from nothing cached
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.PROBE_REGISTRY || 'ghcr.io' }}
          username: ${{ vars.PROBE_REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.PROBE_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.52.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true
          version: v2.18.2
      - run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - name: Build and sign the release
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: scripts/release.sh
      - name: Verify it
        env:
          COSIGN_PUBLIC_KEY_PEM: ${{ vars.COSIGN_PUBLIC_KEY }}
          HAS_KEY: ${{ secrets.COSIGN_KEY != '' }}
          WORKFLOW: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/armor-preflight-release.yml
        run: |
          if [ "$HAS_KEY" = true ]; then
            [ -n "$COSIGN_PUBLIC_KEY_PEM" ] || { echo "set the COSIGN_PUBLIC_KEY variable to verify key-signed releases"; exit 1; }
            printf '%s\n' "$COSIGN_PUBLIC_KEY_PEM" >"$RUNNER_TEMP/cosign.pub"
            COSIGN_PUBLIC_KEY=$RUNNER_TEMP/cosign.pub scripts/verify-release.sh build/release
          else
            CERT_IDENTITY="^${WORKFLOW//./\\.}@refs/tags/v" \
            CERT_OIDC_ISSUER=https://token.actions.githubusercontent.com \
              scripts/verify-release.sh build/release
          fi
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/release/* \
            --draft --verify-tag \
            --title "armor-preflight $VERSION" \
            --notes "Verify these files before use: see the README section \"Verifying a release\". Probe image: $(cat build/release/probe-image.txt)"
