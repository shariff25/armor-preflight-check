# Release build for armor-preflight. Run it through scripts/release.sh, which
# builds and signs the probe image first (its digest becomes the binary's
# default probe image) and signs checksums.txt afterwards.
version: 2
project_name: armor-preflight

builds:
  - id: armor-preflight
    main: ./cmd/armor-preflight
    binary: armor-preflight
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux] # runs on the machine Armor is deployed from (DECISIONS: M7)
    goarch: [amd64, arm64]
    # The commit time, so rebuilding a commit reproduces the same binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/shariff25/armor-preflight-check/internal/buildinfo.Version={{ .Version }}
      - -X github.com/shariff25/armor-preflight-check/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/shariff25/armor-preflight-check/internal/buildinfo.Date={{ .CommitDate }}
      - -X github.com/shariff25/armor-preflight-check/internal/buildinfo.ProbeImage={{ .Env.PROBE_IMAGE }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, SECURITY-BRIEF.md]

# One SPDX SBOM per archive (syft).
sboms:
  - artifacts: archive

# checksums.txt covers the archives, their SBOMs and the probe image files,
# so one signature over it covers the whole release.
checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: build/probe/*_oci.tar
    - glob: build/probe/*.spdx.json
    - glob: build/probe/probe-image.txt

snapshot:
  version_template: "{{ .Env.VERSION }}"

changelog:
  disable: true
